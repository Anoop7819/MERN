<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            height: 100px;
            border: 1px solid #54fb68;
            margin: 10px 0;
        }
        .box {
            background-color: #b8b826;
            padding: 10px;
            border: 1px solid #6031ab;
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="box">Item 1</p>
        <p class="box">Item 2</p>
        <p class="box">Item 3</p>
        <p class="box">Item 4</p>
    </div>
    
</body>
</html>
