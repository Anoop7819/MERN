<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table {
            border-collapse: collapse;
        }

        td {
            text-align: center;
            padding: 5px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <table cellpadding="10" cellspacing="1" border="2">
        <tr>
            <td rowspan = "3">Day</td>
            <td colspan = "3">Seminar</td>
        </tr>
        <tr>
            <td colspan = "2">Schedule</td>
            <td rowspan ="2"> Topic</td>
        </tr>
        <tr>
            <td>Begin</td>
            <td>End</td>
        </tr>
        <tr>
            <td rowspan="2">Monday</td>
            <td rowspan="2">8:00 a.m</td>
            <td rowspan = "2">5:00 a.m</td>
            <td>Introduction to XML</td>
        </tr>
        <tr>
            <td>Validity:DTD and Relax NG</td>
        </tr>
        <tr>
            <td rowspan = "3">Tuesday</td>
            <td>8:00 a.m</td>
            <td>11:00 a.m</td>
            <td rowspan = "2">XPath</td>
        </tr>
        <tr>
            <td>11:00 a.m</td>
            <td>2:00 p.m</td>
        </tr>
        <tr>
            <td>2:00 p.m</td>
            <td>5:00 p.m</td>
            <td> XSLTransformations</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>8:00 a.m</td>
            <td>12:00 p.m</td>
            <td>XLS formating objects</td>
        </tr>
        </body>
</html>
