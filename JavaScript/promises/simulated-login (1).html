<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Promise Login Demo</title>
    <script>
      const form = document.getElementById("form");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const submitButton = document.getElementById("submit");
      const messageDiv = document.getElementById("message");

      function simulateLogin(email, password) {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            if (email === "student@example.com" && password === "learn123") {
              resolve("Login successful!");} else {
                reject("Invalid email or password.");
              }
          }, 1000);
        });
      }
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: #e2e8f0;
        color: #0f172a;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(94vw, 500px);
        background: white;
        padding: 2rem;
        border-radius: 22px;
        box-shadow: 0 18px 50px #0f172a18;
      }
      label {
        display: block;
        font-weight: 650;
        margin: 0.8rem 0 0.35rem;
      }
      input {
        width: 100%;
        padding: 0.8rem;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font: inherit;
      }
      button {
        margin-top: 1rem;
        padding: 0.8rem 1rem;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-weight: 750;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
      }
      #message {
        margin-top: 1rem;
        padding: 1rem;
        border-radius: 10px;
        background: #f8fafc;
        white-space: pre-wrap;
      }
      .success {
        color: #166534;
        background: #f0fdf4 !important;
      }
      .error {
        color: #991b1b;
        background: #fef2f2 !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Simulated Login</h1>
      <p>
        Learn Promise chaining, rejection handling, and finally-based loading
        cleanup.
      </p>
      <form id="form">
        <label for="email">Email</label
        ><input
          id="email"
          type="email"
          autocomplete="username"
          value="student@example.com"
          required
        />
        <label for="password">Demo password</label
        ><input
          id="password"
          type="password"
          autocomplete="current-password"
          value="learn123"
          required
        />
        <button id="submit" type="submit">Log in</button>
      </form>
      <div id="message" aria-live="polite">
        Demo credentials: student@example.com / learn123
      </div>
    </main>
  </body>
</html>
